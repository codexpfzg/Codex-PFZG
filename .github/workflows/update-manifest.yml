name: Automatski manifest skripti

on:
  push:
    paths:
      - "skripte/**/*.pdf"
      - "skripte/**/*.docx"
      - "skripte/**/*.doc"
      - "skripte/**/*.pptx"
      - "skripte/**/*.ppt"
      - "skripte/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Napravi manifest iz materijala
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          scripts_dir = Path("skripte")
          existing = {}
          old_manifest = scripts_dir / "manifest.json"
          if old_manifest.exists():
              try:
                  old = json.loads(old_manifest.read_text(encoding="utf-8"))
                  for f in old.get("files", []):
                      key = f.get("filename") or f.get("path")
                      if key:
                          existing[key] = f
              except Exception:
                  pass

          allowed_extensions = {".pdf", ".docx", ".doc", ".pptx", ".ppt"}
          files = []

          for material in sorted(scripts_dir.rglob("*")):
              if not material.is_file():
                  continue
              if material.suffix.lower() not in allowed_extensions:
                  continue
              if material.name == "manifest.json":
                  continue

              filename = material.name
              path = material.as_posix()
              prev = existing.get(filename) or existing.get(path)
              if prev and prev.get("title"):
                  title = prev["title"]
              else:
                  title = material.stem.replace("-", " ").replace("_", " ").strip()

              files.append({
                  "filename": filename,
                  "path": path,
                  "title": title
              })

          output = scripts_dir / "manifest.json"
          output.write_text(
              json.dumps({"files": files}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Spremi manifest u repozitorij
        run: |
          if git diff --quiet -- skripte/manifest.json; then
            echo "Manifest je već ažuran."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add skripte/manifest.json
          git commit -m "Automatsko ažuriranje manifesta skripti"
          git push
