name: Automatski manifest skripti

on:
  push:
    paths:
      - "skripte/**/*.pdf"
      - "skripte/**/*.docx"
      - "skripte/**/*.doc"
      - "skripte/**/*.pptx"
      - "skripte/**/*.ppt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Napravi manifest iz materijala
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          scripts_dir = Path("skripte")
          files = []

          allowed_extensions = {
              ".pdf",
              ".docx",
              ".doc",
              ".pptx",
              ".ppt"
          }

          for material in sorted(scripts_dir.rglob("*")):
              if not material.is_file():
                  continue

              if material.suffix.lower() not in allowed_extensions:
                  continue

              files.append({
                  "filename": material.name,
                  "path": material.as_posix(),
                  "title": material.stem.replace("-", " ").replace("_", " ")
              })

          output = scripts_dir / "manifest.json"

          output.write_text(
              json.dumps(
                  {"files": files},
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Spremi manifest u repozitorij
        run: |
          if git diff --quiet -- skripte/manifest.json; then
            echo "Manifest je već ažuran."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add skripte/manifest.json
          git commit -m "Automatsko ažuriranje manifesta skripti"
          git push
