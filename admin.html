<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Codex PFZG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/jpeg" href="assets/img/ICO.jpg">
  <link rel="apple-touch-icon" href="assets/img/ICO.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="terms-page-body">
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="hero-header">
    <a href="index.html" class="back">← Natrag</a>
    <a href="index.html" class="logo">Codex <strong>PFZG</strong></a>
    <button id="theme" type="button">Light mode</button>
  </header>

  <main class="page">
    <section class="heading reveal">
      <h1>Admin – predane skripte</h1>
    </section>

    <div id="auth-section" class="block reveal">
      <small>CODEX PFZG</small>
      <h2>Prijava</h2>
      <p>Prijavite se administratorskim e-mailom i lozinkom.</p>
      <form id="login-form" style="margin-top:1.2rem;max-width:360px">
        <input
          type="email"
          id="email-input"
          placeholder="admin@email.com"
          required
          style="width:100%;padding:0.7rem 0.9rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary)"
        >
        <input
          type="password"
          id="password-input"
          placeholder="Lozinka"
          required
          style="width:100%;margin-top:0.6rem;padding:0.7rem 0.9rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary)"
        >
        <button type="submit" class="btn-cta" style="margin-top:0.9rem">Prijavi se</button>
        <p id="login-message" style="margin-top:0.9rem;color:var(--text-secondary)"></p>
      </form>
    </div>

    <div id="admin-section" class="block reveal" style="display:none">
      <small>CODEX PFZG</small>
      <h2>Skripte čekaju odobrenje</h2>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:0.4rem;gap:0.6rem;flex-wrap:wrap">
        <p style="color:var(--text-secondary)">Pregledajte nove prijedloge i objavite ih ili odbijte.</p>
        <div style="display:flex;gap:0.5rem">
          <button id="refresh-btn" type="button" class="btn-ghost">Osvježi</button>
          <button id="logout-btn" type="button" class="btn-ghost">Odjava</button>
        </div>
      </div>
      <ul id="admin-list" class="list" style="margin-top:1.4rem"></ul>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">© <span id="year"></span> Codex PFZG</div>
    <div class="footer-right">
      <a href="index.html" class="footer-legal-link">Natrag na početnu</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const admin = {};

    try {
      const savedTheme = localStorage.getItem('skriptomat_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.body.classList.toggle('light', savedTheme === 'light');
    } catch {}

    (function init() {
      const supa = window.supabaseConfig ? window.supabaseConfig() : null;
      if (supa) {
        admin.supa = supa;
        checkSession();
      } else {
        const m = document.getElementById('login-message');
        if (m) m.innerHTML = 'Supabase nije konfiguriran. Otvori datoteku <strong>supabase-config.js</strong> i u nju upiši svoj <strong>SUPABASE_URL</strong> i <strong>SUPABASE_PUBLISHABLE_KEY</strong> (Dashboard > Project Settings > API), zatim pokreni <strong>supabase-setup.sql</strong> u SQL Editoru i osvježi stranicu.';
      }
    })();

    const ADMIN_EMAIL = 'Ipintar03@gmail.com';

    function checkSession() {
      admin.supa.auth.getSession().then(({ data }) => {
        if (data.session) handleAuth(data.session);
      });
    }

    function handleAuth(session) {
      const email = session.user.email;
      if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        admin.supa.auth.signOut();
        const m = document.getElementById('login-message');
        m.textContent = 'Ovaj račun nema administratorski pristup.';
        document.getElementById('admin-section').style.display = 'none';
        document.getElementById('auth-section').style.display = '';
        return;
      }
      showAdmin();
    }

    function showAdmin() {
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('admin-section').style.display = '';
      loadSubmissions();
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const m = document.getElementById('login-message');
      if (!admin.supa) {
        m.textContent = 'Supabase nije konfiguriran. Postavi URL i key u supabase-config.js i pokreni supabase-setup.sql.';
        return;
      }
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      m.textContent = '';
      try {
        const { error } = await admin.supa.auth.signInWithPassword({ email, password });
        if (error) {
          m.textContent = 'Neuspjela prijava: ' + error.message;
        }
      } catch (err) {
        m.textContent = 'Greška: ' + err.message;
      }
    });

    admin.supa && admin.supa.auth.onAuthStateChange((_event, session) => {
      if (session) handleAuth(session);
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      if (admin.supa) await admin.supa.auth.signOut();
      document.getElementById('admin-section').style.display = 'none';
      document.getElementById('auth-section').style.display = '';
      document.getElementById('login-message').textContent = '';
    });

    document.getElementById('refresh-btn').addEventListener('click', loadSubmissions);

    async function loadSubmissions() {
      const list = document.getElementById('admin-list');
      if (!admin.supa) {
        list.innerHTML = '<li><div class="card" style="padding:1.4rem 1.2rem"><p>Supabase nije konfiguriran. Postavi URL i publishable key u datoteci <code>supabase-config.js</code>.</p></div></li>';
        return;
      }
      const { data, error } = await admin.supa
        .from('script_submissions')
        .select('id, subject_id, file_name, storage_path, author_nickname, submitted_at, status')
        .eq('status', 'pending')
        .order('submitted_at', { ascending: true });
      list.innerHTML = '';
      if (error) {
        list.innerHTML = '<li><div class="card"><p>Nije uspjelo učitavanje predaja.</p></div></li>';
        return;
      }
      if (!data || data.length === 0) {
        list.innerHTML = '<li><div class="card"><p>Nema predaja koje čekaju odobrenje.</p></div></li>';
        return;
      }
      data.forEach(sub => {
        const li = document.createElement('li');
        li.innerHTML =
          '<div class="card" style="padding:1.4rem 1.2rem">' +
            '<div style="display:flex;justify-content:space-between;gap:0.8rem;align-items:flex-start;flex-wrap:wrap">' +
              '<div style="flex:1;min-width:180px">' +
                '<strong style="font-size:var(--text-lg)">' + (sub.file_name || 'Neimenovana datoteka') + '</strong>' +
                '<p style="color:var(--text-secondary);font-size:var(--text-sm);margin-top:0.2rem">Predmet: ' + (sub.subject_id || '—') + ' · ' + new Date(sub.submitted_at).toLocaleString('hr-HR') + '</p>' +
                '<p style="color:var(--text-tertiary);font-size:var(--text-xs);margin-top:0.1rem">Autor: ' + (sub.author_nickname || 'Anonimno') + '</p>' +
              '</div>' +
              '<div style="display:flex;gap:0.6rem;margin-top:0.2rem">' +
                '<a class="btn-ghost" href="' + (admin.supa.storage.from('skripte').getPublicUrl(sub.storage_path).data.publicUrl) + '" target="_blank" rel="noopener">Pregledaj</a>' +
                '<button class="btn-cta" data-approve="' + sub.id + '">Odobri</button>' +
                '<button class="btn-ghost" data-reject="' + sub.id + '">Odbij</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        list.appendChild(li);
      });
    }

    document.getElementById('admin-list').addEventListener('click', async (e) => {
      const approveId = e.target.getAttribute('data-approve');
      const rejectId = e.target.getAttribute('data-reject');
      if (!approveId && !rejectId) return;
      const status = approveId ? 'approved' : 'rejected';
      const id = approveId || rejectId;
      const { error } = await admin.supa
        .from('script_submissions')
        .update({ status, reviewed_at: new Date().toISOString() })
        .eq('id', id);
      if (error) {
        alert('Greška: ' + error.message);
      } else {
        loadSubmissions();
      }
    });

    document.getElementById('theme').addEventListener('click', () => {
      const t = document.documentElement.getAttribute('data-theme');
      const next = t === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      document.body.classList.toggle('light', next === 'light');
      try { localStorage.setItem('skriptomat_theme', next); } catch {}
      document.getElementById('theme').textContent = next === 'light' ? 'Dark mode' : 'Light mode';
    });

    document.querySelectorAll('.reveal').forEach(element => element.classList.add('show'));
  </script>
</body>
</html>
